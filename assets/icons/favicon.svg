<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    width="64"
    height="64"
>

    <!-- Background -->
    <rect
        width="64"
        height="64"
        rx="16"
        fill="#080a0f"
    />

    <!-- Terminal window -->
    <rect
        x="8"
        y="11"
        width="48"
        height="42"
        rx="7"
        fill="#10141d"
        stroke="#506cff"
        stroke-width="2"
    />

    <!-- Terminal top bar -->
    <line
        x1="8"
        y1="21"
        x2="56"
        y2="21"
        stroke="#252c3a"
        stroke-width="2"
    />

    <!-- Terminal dots -->
    <circle
        cx="15"
        cy="16"
        r="2"
        fill="#6f82ff"
    />

    <circle
        cx="22"
        cy="16"
        r="2"
        fill="#8f75ff"
    />

    <circle
        cx="29"
        cy="16"
        r="2"
        fill="#6be5a1"
    />

    <!-- Code prompt -->
    <path
        d="M17 30
           L24 36
           L17 42"
        fill="none"
        stroke="#79a1ff"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Cursor -->
    <rect
        x="29"
        y="39"
        width="10"
        height="3"
        rx="1.5"
        fill="#8f75ff"
    />

    <!-- Small eye -->
    <path
        d="M40 31
           C44 27 49 27 53 31
           C49 35 44 35 40 31Z"
        fill="none"
        stroke="#d8ddff"
        stroke-width="2"
    />

    <circle
        cx="46.5"
        cy="31"
        r="1.8"
        fill="#79a1ff"
    />

</svg>
